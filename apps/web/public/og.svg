  <g transform="translate(76 115)">
    <rect x="5" y="5" width="50" height="50" rx="10" fill="none" stroke="#c5a568" stroke-width="2" transform="rotate(45 30 30)"/>
    <path d="M30 13C19 21 21 29 30 30C39 29 41 21 30 13ZM30 47C41 39 39 31 30 30C21 31 19 39 30 47Z" fill="none" stroke="#c5a568" stroke-width="3"/>
