    <path d="M112 111H423L487 165L454 359L390 410H147L83 359L50 165Z" fill="none" stroke="#d0b476" stroke-opacity=".38" stroke-width="2"/>
    <text x="268" y="249" text-anchor="middle" fill="#c5a568" fill-opacity=".68" font-family="Georgia,serif" font-size="32" letter-spacing="9">LOW STAKES</text>
    <text x="268" y="278" text-anchor="middle" fill="#c5a568" fill-opacity=".55" font-family="Arial,sans-serif" font-size="10" letter-spacing="4">BLACKJACK PAYS 3 TO 2</text>
    <g transform="translate(344 54) rotate(7)">
      <rect x="0" y="0" width="116" height="164" rx="10" fill="#eee3cd" stroke="#6d4f2e" stroke-width="3"/>
      <rect x="8" y="8" width="100" height="148" rx="7" fill="#5f2521" stroke="#d0b476" stroke-width="4"/>
      <rect x="15" y="15" width="86" height="134" rx="4" fill="url(#lattice)" stroke="#d0b476"/>
      <rect x="42" y="57" width="32" height="32" fill="#5f2521" stroke="#d0b476" stroke-width="2" transform="rotate(45 58 73)"/>
      <text x="58" y="79" text-anchor="middle" fill="#ead7ad" font-family="Arial,sans-serif" font-size="13" font-weight="700">LS</text>
    </g>
    <g transform="translate(397 76) rotate(16)">
      <rect x="0" y="0" width="116" height="164" rx="10" fill="#eee3cd" stroke="#6d4f2e" stroke-width="3"/>
      <rect x="8" y="8" width="100" height="148" rx="7" fill="#5f2521" stroke="#d0b476" stroke-width="4"/>
      <rect x="15" y="15" width="86" height="134" rx="4" fill="url(#lattice)" stroke="#d0b476"/>
      <rect x="42" y="57" width="32" height="32" fill="#5f2521" stroke="#d0b476" stroke-width="2" transform="rotate(45 58 73)"/>
      <text x="58" y="79" text-anchor="middle" fill="#ead7ad" font-family="Arial,sans-serif" font-size="13" font-weight="700">LS</text>
    </g>
    <g fill="#111512" stroke="#c5a568" stroke-width="4">
      <circle cx="118" cy="355" r="27"/><circle cx="214" cy="397" r="27"/><circle cx="323" cy="397" r="27"/><circle cx="420" cy="355" r="27"/>
    </g>
