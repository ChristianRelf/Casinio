    <text x="2" y="147" fill="#f0e8d7" font-family="Georgia,serif" font-size="73">Private blackjack.</text>
    <text x="2" y="218" fill="#c5a568" font-family="Georgia,serif" font-size="68" font-style="italic">Questionable choices.</text>
    <text x="5" y="282" fill="#a4aaa3" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">A REALTIME TABLE FOR YOUR DISCORD CALL</text>
